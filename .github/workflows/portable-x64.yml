# x64 portable zip only. The slice of make.bat that does not need Inno Setup or an arm64 pass.
# A run's zip is the Actions artifact Lertaro-Portable, not a GitHub Release.
name: Portable x64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # No packages.lock.json, so setup-dotnet's own cache input cannot key a restore.
      # Hash the project files instead. The previous run's global-packages folder is what
      # actually skips the download; obj/ stays out so a stale incremental publish cannot ship.
      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}

      - name: Test merged application and plugins
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          $projects = Get-ChildItem Tests -Recurse -Filter *.csproj
          $failed = $false
          foreach ($project in $projects) {
            $relative = [IO.Path]::GetRelativePath($PWD.Path, $project.FullName)
            $name = $relative.Replace([IO.Path]::DirectorySeparatorChar, '_').Replace([IO.Path]::AltDirectorySeparatorChar, '_') + '.trx'
            # These upstream projects currently contain no test methods; still compile their references.
            if ($project.Directory.Name -in @('Files', 'OneCommander')) {
              dotnet build $project.FullName -c Release
              if ($LASTEXITCODE -ne 0) { $failed = $true }
              continue
            }
            dotnet test $project.FullName -c Release --logger "trx;LogFileName=$name" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }
            [xml]$report = Get-Content (Join-Path TestResults $name) -Raw
            if ([int]$report.TestRun.ResultSummary.Counters.total -eq 0) {
              Write-Host "::error::No tests ran for $relative"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Publish
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          $out = "publish/x64/Lertaro"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          dotnet publish Lertaro.slnx -c Release -o $out -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish Lertaro.Plugins.slnx -c Release -o "$out/Plugins" -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item portable-updater.bat, portable-updater.ps1, install-dotnet-runtime.bat, portable-cleanup.bat -Destination $out
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item -Force

      # upload-artifact zips its path. Uploading the directory once is the portable zip;
      # uploading an already-zipped Lertaro-Portable.zip wraps a second zip around it.
      - name: Upload Lertaro-Portable
        uses: actions/upload-artifact@v7
        with:
          name: Lertaro-Portable
          path: publish/x64/Lertaro/
          if-no-files-found: error
