# x64 portable zip only. The slice of make.bat that does not need Inno Setup or an arm64 pass.
# A run's zip is the Actions artifact Lertaro-Portable, not a GitHub Release.
name: Portable x64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # No packages.lock.json, so setup-dotnet's own cache input cannot key a restore.
      # Hash the project files instead. The previous run's global-packages folder is what
      # actually skips the download; obj/ stays out so a stale incremental publish cannot ship.
      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}

      - name: Test recent folders, quick navigation and Explorer integration
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          $projects = @(
            "Tests/Core/Core.csproj",
            "Tests/App/App.csproj",
            "Tests/Plugins/FolderCascader/FolderCascader.csproj",
            "Tests/Plugins/CoreExtensions/CoreExtensions.csproj"
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --filter "FullyQualifiedName~RecentFolder|FullyQualifiedName~ExplorerInlineSearchAdapter|FullyQualifiedName~ExplorerHostReadFloor|FullyQualifiedName~QuickNavigation|FullyQualifiedName~ExplorerTabLocator|FullyQualifiedName~BuildStartInfo" --logger trx --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test incremental indexing and service shutdown
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          dotnet test Tests/Core/Core.csproj -c Release --filter "FullyQualifiedName~IndexV2|FullyQualifiedName~Indexer.Usn|FullyQualifiedName~IdleTrimGate|FullyQualifiedName~MonitorLoopJoin|FullyQualifiedName~UsnServicePipeServerTests|FullyQualifiedName~Lertaro.Core.Tests.Hook|FullyQualifiedName~SearchPipeClientTests|FullyQualifiedName~ServicePipeReadinessTests" --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test animation controls and settings search
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          dotnet test Tests/App/App.csproj -c Release --filter "FullyQualifiedName~AnimationControlTests|FullyQualifiedName~SmoothWheelScrollBehaviorTests|FullyQualifiedName~MarqueeBehaviorTests|FullyQualifiedName~SettingsSearchIndexTests|FullyQualifiedName~ServiceConnectionHandlerTests|FullyQualifiedName~ServiceInstallOutcomeHelperTests" --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test custom filter shortcuts
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          $checks = @{
            "Tests/Core/Core.csproj" = "FullyQualifiedName~FileTypeFilterSearchTests|FullyQualifiedName~SearchRequestBinarySerializerTests|FullyQualifiedName~HotkeyStringFormatTests|FullyQualifiedName~FzfTopNTests"
            "Tests/App/App.csproj" = "FullyQualifiedName~SearchFilterShortcutTests|FullyQualifiedName~WpfUiHelperTests|FullyQualifiedName~PluginConfig|FullyQualifiedName~QueryTokenResultComposerTests"
            "Tests/PluginSdk/PluginSdk.csproj" = "FullyQualifiedName~FileTypeFilterTests"
            "Tests/Plugins/CoreExtensions/CoreExtensions.csproj" = "FullyQualifiedName~CustomFilterQueryTokenProviderTests"
          }
          foreach ($check in $checks.GetEnumerator()) {
            dotnet test $check.Key -c Release --filter $check.Value --logger trx --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          $out = "publish/x64/Lertaro"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          dotnet publish Lertaro.slnx -c Release -o $out -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish Lertaro.Plugins.slnx -c Release -o "$out/Plugins" -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item portable-updater.bat, install-dotnet-runtime.bat, portable-cleanup.bat -Destination $out
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item -Force

      # upload-artifact zips its path. Uploading the directory once is the portable zip;
      # uploading an already-zipped Lertaro-Portable.zip wraps a second zip around it.
      - name: Upload Lertaro-Portable
        uses: actions/upload-artifact@v7
        with:
          name: Lertaro-Portable
          path: publish/x64/Lertaro/
          if-no-files-found: error
